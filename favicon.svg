<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cardano Relay Health Ranking">
  <title>Cardano Relay Health Ranking</title>
  <defs>
    <linearGradient id="g" x1="5" y1="4" x2="27" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a274ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded ground so the mark holds its edge on a light browser tab. -->
  <rect width="32" height="32" rx="7.5" fill="#0a0726"/>

  <!-- The same hexagon the page draws its six axes on. The stroke is heavy
       on purpose: at 16px, which is the size a tab actually renders, a finer
       line closes up into a blob. Vertex dots were tried and dropped for the
       same reason - they were only legible from 32px up. -->
  <path d="M16 5.2 25.6 10.6v10.8L16 26.8 6.4 21.4V10.6Z"
        fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linejoin="round"/>

  <!-- Green core, the colour the page uses for reachable. Carries the meaning
       and gives the mark something that survives being shrunk. -->
  <circle cx="16" cy="16" r="3.4" fill="#34e2b0"/>
</svg>
