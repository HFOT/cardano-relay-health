name: Tip check (one-off)

# One question: does cardano-cli's tip request work from a Linux runner? The
# Windows build fails it with SDUWriteTimeout; upstream runs Linux. Manual only,
# writes nothing. Delete once answered.
on:
  workflow_dispatch:

jobs:
  tip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch cardano-cli 11.0.0.0 (the version upstream documents)
        run: |
          curl -sL -o cli.tgz https://github.com/IntersectMBO/cardano-cli/releases/download/cardano-cli-11.0.0.0/cardano-cli-11.0.0.0-x86_64-linux.tar.gz
          mkdir cli && tar -xzf cli.tgz -C cli
          CLI=$(find cli -type f -name 'cardano-cli*' | head -1)
          chmod +x "$CLI"; echo "CLI=$CLI" >> $GITHUB_ENV
          "$CLI" --version | head -1
      - name: Ask for tip
        run: |
          for hp in backbone.cardano.iog.io:3001 relay-1-eu.junostakepool.com:4321 relay-1-cloud.junostakepool.com:3015 relay-0-eu.junostakepool.com:4321; do
            h=${hp%:*}; p=${hp##*:}
            echo "=== $hp ==="
            start=$(date +%s)
            timeout 40 "$CLI" ping -h "$h" -p "$p" -m 764824073 -c 1 -q -j -t > out.json 2> err.txt; rc=$?
            echo "rc=$rc  elapsed=$(( $(date +%s) - start ))s"
            head -c 900 out.json; echo
            head -c 300 err.txt; echo
          done
