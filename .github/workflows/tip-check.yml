name: Self-probe trial (manual)

# Runs tools/selfprobe.py on a Linux runner and uploads what it produced, so the
# output can be compared with upstream before the daily rebuild is allowed to
# use it. Manual only; writes nothing to the repository.
on:
  workflow_dispatch:
    inputs:
      max_pools:
        description: 'Probe only this many minting pools (0 = all)'
        default: '60'

jobs:
  selfprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch cardano-cli 11.0.0.0 (the version upstream documents)
        run: |
          curl -sL -o cli.tgz https://github.com/IntersectMBO/cardano-cli/releases/download/cardano-cli-11.0.0.0/cardano-cli-11.0.0.0-x86_64-linux.tar.gz
          mkdir -p cli && tar -xzf cli.tgz -C cli
          CLI=$(find cli -type f -name 'cardano-cli*' | head -1)
          chmod +x "$CLI"; echo "CLI=$PWD/$CLI" >> $GITHUB_ENV
          pip install --quiet dnspython
      - name: Collect
        env:
          MAX_POOLS: ${{ inputs.max_pools }}
        run: |
          case "$MAX_POOLS" in ''|*[!0-9]*) echo "max_pools must be a number"; exit 1;; esac
          python3 tools/selfprobe.py --cli "$CLI" --out selfdata --max-pools "$MAX_POOLS"
      - uses: actions/upload-artifact@v4
        with:
          name: selfdata
          path: selfdata/
