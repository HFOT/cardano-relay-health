name: Rebuild ranking

# Pulls the three public ABCDE CSVs, regenerates index.html, and commits it
# only when the output actually changed.
on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-ranking
  cancel-in-progress: false

jobs:
  build:
    # Windows PowerShell 5.1 is the environment the generator is written and tested against.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ABCDE source data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $base = 'https://raw.githubusercontent.com/BEACNpool/ABCDE/main/data/small'
          New-Item -ItemType Directory -Force data | Out-Null
          foreach ($f in 'relay_pool_health.csv','relay_shared_hosts.csv','pool_operator_kes_members.csv') {
            Invoke-WebRequest -Uri "$base/$f" -OutFile "data/$f" -UseBasicParsing
            $size = (Get-Item "data/$f").Length
            if ($size -lt 1024) { throw "$f looks truncated ($size bytes)" }
            Write-Output "$f  $size bytes"
          }

      - name: Check upstream schema
        shell: powershell
        run: ./tools/check-schema.ps1 -SrcDir data

      # Upstream dropped registers_foreign_infrastructure, so this axis is
      # checked against the chain directly. Koios is public and needs no key.
      # This one affects scoring, so it hard-fails the build on a bad fetch
      # rather than degrading gracefully like the two below it.
      - name: Detect borrowed bootstrap relays
        shell: powershell
        run: ./tools/fetch-foreign-infra.ps1 -OutDir data

      # The two steps below are informational only - they add citations
      # (a community pool-grouping database, a registration-formatting note)
      # that never affect scoring. Both degrade gracefully on their own if
      # Koios has a bad moment: today's page just publishes without that one
      # citation, rather than failing the whole rebuild over it.
      - name: Fetch pool_groups labels
        shell: powershell
        run: ./tools/fetch-pool-groups.ps1 -OutDir data

      - name: Fetch network saturation point
        shell: powershell
        continue-on-error: true
        run: ./tools/fetch-saturation.ps1 -OutDir data

      - name: Fetch registered pool fees
        shell: powershell
        continue-on-error: true
        run: ./tools/fetch-pool-fees.ps1 -OutDir data

      # The only fetch here without a bulk form - one request per pool, so it
      # runs in parallel and still takes ~15 minutes. Display only, so a bad
      # run costs the sparklines and nothing else.
      - name: Fetch stake history for sparklines
        shell: powershell
        continue-on-error: true
        timeout-minutes: 40
        run: ./tools/fetch-pool-history.ps1 -OutDir data -Epochs 18 -Parallel 8

      - name: Fetch relay registration notes
        shell: powershell
        run: ./tools/fetch-relay-notes.ps1 -OutDir data

      - name: Generate page
        shell: powershell
        run: |
          $out = ./tools/generate-ranking.ps1 -SrcDir data -Template tools/template.html -OutFile index.html
          Write-Output $out
          # A dropped filter column would empty the ranking without erroring.
          $ranked = [int](($out | Select-String -Pattern 'with (\d+) ranked').Matches.Groups[1].Value)
          if ($ranked -lt 500) { throw "Only $ranked pools ranked - expected ~1300. Refusing to publish." }
          $size = (Get-Item index.html).Length
          if ($size -lt 200000) { throw "index.html looks wrong ($size bytes)" }
          Write-Output "index.html  $size bytes, $ranked pools"

      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No change in index.html — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild ranking from ABCDE data ($(date -u '+%Y-%m-%d'))"
          # A push from a person while this run was building rejects this one.
          # The commit is a data-only rebuild and the next run regenerates it
          # from the same source, so losing it costs nothing - failing the
          # workflow over it would just be noise. Warn and stop cleanly.
          if ! git push; then
            echo "::warning::Push rejected - the branch moved while this run was building. Skipping today's data-only rebuild; the next run will redo it."
            exit 0
          fi
