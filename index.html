<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardano Relay Health Ranking</title>
<style>
:root{
  --bg0:#06031a;--bg1:#0a0726;
  --glass:rgba(255,255,255,.038);--glass2:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.09);--stroke2:rgba(255,255,255,.17);
  --ink:#eceafd;--muted:#9a9fd0;--dim:#6e73a6;
  --v:#8b5cff;--v2:#b78bff;--c:#22d3ee;--m:#34e2b0;--a:#fbbf24;--p:#ff5c93;
  --S:#34e2b0;--A:#22d3ee;--B:#8b5cff;--C:#fbbf24;--D:#ff5c93;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:15px/1.65 system-ui,"Segoe UI","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;background:var(--bg0);position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(760px 520px at 12% -8%, rgba(139,92,255,.34), transparent 62%),
    radial-gradient(680px 480px at 88% 4%, rgba(34,211,238,.20), transparent 60%),
    radial-gradient(900px 700px at 50% 108%, rgba(52,226,176,.13), transparent 62%),
    linear-gradient(180deg,#0a0726 0%,#06031a 55%,#050214 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:54px 54px;
  -webkit-mask-image:radial-gradient(circle at 50% 22%,#000 0%,transparent 74%);
  mask-image:radial-gradient(circle at 50% 22%,#000 0%,transparent 74%)}
.wrap{max-width:1280px;margin:auto;padding:38px 20px 80px;position:relative}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(30px,4.4vw,50px);margin:8px 0 0;letter-spacing:-.03em;line-height:1.1;
   background:linear-gradient(96deg,#fff 8%,#c9b6ff 44%,#5eead4 96%);
   -webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:56px 0 6px;font-size:23px;letter-spacing:-.015em}
h3{margin:0 0 12px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.2em;
  color:#b9a6ff;border:1px solid rgba(139,92,255,.4);background:rgba(139,92,255,.12);
  border-radius:999px;padding:5px 13px}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--m);box-shadow:0 0 9px var(--m);display:block}
.lead{color:var(--muted);max-width:940px;margin:12px 0 0}
.lead b{color:var(--ink)}

.langsw{display:inline-flex;border:1px solid var(--stroke2);border-radius:999px;overflow:hidden;
  background:rgba(255,255,255,.05);flex:none}
.langsw button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;
  padding:7px 15px;cursor:pointer;transition:.16s}
.langsw button:hover{color:var(--ink)}
.langsw button[aria-pressed="true"]{background:linear-gradient(96deg,rgba(139,92,255,.42),rgba(34,211,238,.3));
  color:#fff;box-shadow:0 0 20px -6px var(--v)}

.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 18px 44px rgba(3,0,20,.5)}

/* ---------- summary ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:28px 0 0}
.stat{padding:15px 17px}
.stat span{color:var(--muted);font-size:12px}
.stat b{display:block;font-size:27px;line-height:1.25;font-variant-numeric:tabular-nums;
  background:linear-gradient(92deg,#8b5cff,#22d3ee 55%,#34e2b0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.stat small{color:var(--dim);font-size:11px}

/* ---------- charts ---------- */
.charts{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(0,1fr);gap:14px;margin:14px 0 0}
.chart{padding:18px 18px 14px;min-width:0}
.chart>svg{display:block;width:100%;height:auto;overflow:visible}
.cap{color:var(--dim);font-size:11.5px;margin:10px 0 0;line-height:1.55}
.hexnote{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.dist{display:flex;gap:8px;margin:13px 0 0}
.dist button{flex:1;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;
  padding:11px 12px;cursor:pointer;font:inherit;color:inherit;text-align:left;transition:.16s}
.dist button:hover{border-color:var(--stroke2);background:var(--glass2);transform:translateY(-1px)}
.dist button[aria-pressed="true"]{border-color:currentColor;box-shadow:0 0 0 1px currentColor,0 0 22px -6px currentColor}
.dist .n{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:7px;color:var(--ink)}
.dist .r{font-size:11px;color:var(--dim)}
.dist .track{height:5px;border-radius:4px;background:rgba(255,255,255,.09);margin-top:9px;overflow:hidden}
.dist .track i{display:block;height:100%;border-radius:4px;background:currentColor;box-shadow:0 0 12px currentColor}

/* ---------- grades ---------- */
.cS{color:var(--S)} .cA{color:var(--A)} .cB{color:var(--B)} .cC{color:var(--C)} .cD{color:var(--D)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:27px;height:27px;padding:0 8px;
  border-radius:9px;font-weight:800;font-size:14px;color:#0a0620;flex:none}
.badge.S{background:var(--S);box-shadow:0 0 16px -3px var(--S)}
.badge.A{background:var(--A);box-shadow:0 0 16px -3px var(--A)}
.badge.B{background:var(--B);box-shadow:0 0 16px -3px var(--B)}
.badge.C{background:var(--C);box-shadow:0 0 16px -3px var(--C)}
.badge.D{background:var(--D);box-shadow:0 0 16px -3px var(--D)}

/* ---------- legend ---------- */
details.legend{margin:22px 0 0;overflow:hidden}
details.legend>summary{cursor:pointer;padding:15px 19px;font-weight:700;list-style:none;color:var(--ink)}
details.legend>summary::-webkit-details-marker{display:none}
details.legend>summary::before{content:"▸ ";color:var(--v2)}
details.legend[open]>summary::before{content:"▾ "}
.legendgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:24px;padding:2px 19px 22px}
.legendgrid ul{list-style:none;margin:0;padding:0}
.legendgrid li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:13px;color:var(--muted)}
.legendgrid li b{color:var(--ink);font-weight:600}
.legendgrid li>span:first-child{flex:none}

/* ---------- pills ---------- */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.legendgrid .dot{margin-top:6px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st-active{color:var(--m)} .st-partial{color:var(--a)}
.st-degraded{color:#ff9558} .st-stopped{color:var(--p)} .st-unknown{color:var(--dim)}
.st-active .dot{background:var(--m);box-shadow:0 0 9px var(--m)}
.st-partial .dot{background:var(--a);box-shadow:0 0 9px var(--a)}
.st-degraded .dot{background:#ff9558;box-shadow:0 0 9px #ff9558}
.st-stopped .dot{background:var(--p);box-shadow:0 0 9px var(--p)}
.st-unknown .dot{background:var(--dim)}

.pill{display:inline-block;border:1px solid var(--stroke2);border-radius:999px;padding:2px 10px;font-size:11.5px;
  color:#c6c9ee;white-space:nowrap;margin:2px 3px 2px 0;background:rgba(255,255,255,.04)}
.pill.ok{color:#7df0c9;border-color:rgba(52,226,176,.42);background:rgba(52,226,176,.11)}
.pill.warn{color:#ffd98a;border-color:rgba(251,191,36,.42);background:rgba(251,191,36,.11)}
.pill.bad{color:#ff9bbb;border-color:rgba(255,92,147,.45);background:rgba(255,92,147,.13)}

/* ---------- toolbar ---------- */
.tools{display:flex;gap:10px;margin:16px 0 10px;flex-wrap:wrap;align-items:center}
input,select{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--stroke2);
  border-radius:11px;padding:9px 13px;font:inherit;font-size:14px}
select option{background:#120d33;color:var(--ink)}
input{min-width:252px}
input::placeholder{color:var(--dim)}
input:focus,select:focus{outline:none;border-color:var(--v);box-shadow:0 0 0 3px rgba(139,92,255,.24)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--stroke2);color:var(--muted);border-radius:999px;
  padding:7px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.16s}
.chip:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
.chip[aria-pressed="true"]{background:linear-gradient(96deg,rgba(139,92,255,.34),rgba(34,211,238,.24));
  border-color:rgba(160,120,255,.75);color:#fff;box-shadow:0 0 20px -6px var(--v)}
.hint{color:var(--dim);font-size:12.5px;margin:0 0 10px}
button.pill{font:inherit;font-size:11.5px;line-height:1.5;cursor:pointer}
button.pill:hover{filter:brightness(1.32);border-color:rgba(255,255,255,.5)}
.rankhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:56px 0 6px}
.rankhead h2{margin:0}
.rankhead h2 code{font:.62em ui-monospace,monospace;color:#a5f3ea}
#backrank{background:rgba(255,255,255,.06);border:1px solid var(--stroke2);color:var(--muted);
  border-radius:999px;padding:6px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
#backrank:hover{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
tr.row.unranked{cursor:default}
tr.row.unranked:hover{background:transparent}
.sigfilter{display:none;align-items:center;gap:8px;font-size:12.5px;color:#ffd98a;
  border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.1);border-radius:999px;padding:6px 8px 6px 14px}
.sigfilter.on{display:inline-flex}
.sigfilter button{background:rgba(0,0,0,.28);border:0;color:#ffd98a;border-radius:50%;width:19px;height:19px;
  cursor:pointer;font:inherit;font-size:12px;line-height:1}

/* ---------- table ---------- */
.tablebox{overflow:auto;border:1px solid var(--stroke);border-radius:18px;background:rgba(10,6,32,.5);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
table{width:100%;border-collapse:collapse;min-width:1000px}
thead th{position:sticky;top:0;z-index:2;background:#150f3a;color:#bfc2ec;text-align:left;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:12px;border-bottom:1px solid var(--stroke2)}
tbody td{padding:12px;border-bottom:1px solid rgba(255,255,255,.055);vertical-align:middle}
tbody tr.row{cursor:pointer;transition:background .13s}
tbody tr.row:hover{background:rgba(139,92,255,.1)}
tbody tr.row.open{background:rgba(139,92,255,.17)}
.rank{font-size:16px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.ticker{font-weight:800;font-size:15px;color:#a5f3ea}
.poolid{font:11px/1.45 ui-monospace,"SFMono-Regular",monospace;color:#6b70a2;max-width:210px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--dim);font-size:11.5px;font-weight:400}
.scorecell{display:flex;align-items:center;gap:9px}
.scoreval{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.mini{display:flex;gap:2px;width:104px;height:7px;margin-top:6px}
.mini i{display:block;height:100%;border-radius:2px;background:rgba(255,255,255,.11);position:relative;overflow:hidden}
.mini i b{position:absolute;top:0;bottom:0;left:0;display:block;border-radius:2px;background:currentColor;
  box-shadow:0 0 8px currentColor}
.caret{color:var(--dim);font-size:10px;display:inline-block;transition:transform .16s}
tr.row.open .caret{transform:rotate(90deg);color:var(--v2)}

/* ---------- detail ---------- */
tr.detail>td{background:rgba(6,3,26,.72);border-bottom:1px solid var(--stroke2);padding:0}
.dpad{padding:20px 22px 22px;display:grid;grid-template-columns:200px minmax(260px,1fr) minmax(280px,1.05fr);gap:26px}
.hexcell{max-width:200px}
.hexcell svg{display:block;width:100%;height:auto;overflow:visible}
.axis{display:grid;grid-template-columns:132px 1fr 62px;gap:9px 12px;align-items:center;font-size:13px}
.axis .lb{color:var(--muted)}
.axis .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden}
.axis .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--v),var(--c) 60%,var(--m))}
.axis .bar.low i{background:linear-gradient(90deg,var(--p),var(--a))}
.axis .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.issues{margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:9px;padding:5px 0;font-size:13px;color:#ffdcae}
.issues li::before{content:"!";flex:none;width:17px;height:17px;border-radius:50%;background:rgba(251,191,36,.2);
  color:var(--a);font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:3px}
.noissue{color:var(--m);font-size:13px;font-weight:700;margin:0}
.note{margin:12px 0 0;font-size:12.5px;color:var(--dim);border-left:2px solid rgba(139,92,255,.5);padding-left:12px}
.note b{color:var(--muted)}
.idrow{display:flex;gap:8px;align-items:center;margin-top:15px;flex-wrap:wrap}
.idrow code{font:11px ui-monospace,monospace;color:#8f93c4;word-break:break-all;background:rgba(0,0,0,.3);
  border:1px solid var(--stroke);border-radius:9px;padding:6px 10px}
.btn{background:linear-gradient(96deg,rgba(139,92,255,.34),rgba(34,211,238,.26));border:1px solid rgba(160,120,255,.6);
  color:#e7e2ff;border-radius:9px;padding:6px 13px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.22)}

.context{color:var(--muted);font-size:12.5px;margin-top:10px;max-width:1000px}
.method{border-radius:16px;padding:17px;color:#c5c8ee}
.method b{color:#fff}
details.method-wrap{margin-top:24px}
details.method-wrap>summary{cursor:pointer;font-weight:700;padding:6px 0;color:var(--v2)}
.foot{color:var(--dim);margin-top:24px;font-size:12px}
#reftable table{min-width:820px}
#reftable td{font-size:13px;color:var(--muted);vertical-align:top}
#reftable td:first-child{color:var(--ink);font-weight:600}
#reftable td:nth-child(3){color:var(--p);font-weight:700;text-align:right;white-space:nowrap}


/* ---------- holder guide ---------- */
.gfab{position:fixed;right:20px;bottom:20px;z-index:50;display:inline-flex;align-items:center;gap:9px;
  background:linear-gradient(96deg,rgba(139,92,255,.92),rgba(34,211,238,.78));border:1px solid rgba(180,150,255,.6);
  color:#fff;border-radius:999px;padding:12px 18px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  box-shadow:0 10px 32px -8px rgba(139,92,255,.85);transition:.18s}
.gfab:hover{transform:translateY(-2px);filter:brightness(1.14)}
.gfab i{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;display:block;flex:none}
.gpanel{position:fixed;right:20px;bottom:20px;z-index:51;width:min(470px,calc(100vw - 40px));
  max-height:min(80vh,760px);display:none;flex-direction:column;border-radius:20px;overflow:hidden;
  background:rgba(11,7,36,.94);border:1px solid var(--stroke2);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 30px 80px -18px rgba(0,0,0,.88)}
.gpanel.on{display:flex}
.ghead{position:relative;padding:16px 46px 13px 18px;border-bottom:1px solid var(--stroke);flex:none}
.ghead h4{margin:0;font-size:15px;letter-spacing:-.01em;color:var(--ink)}
.ghead p{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.gclose{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);border:1px solid var(--stroke2);
  color:var(--muted);border-radius:9px;width:27px;height:27px;cursor:pointer;font:inherit;font-size:13px;line-height:1}
.gclose:hover{color:#fff;background:rgba(255,255,255,.15)}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--stroke);flex:none}
.gtab{background:rgba(255,255,255,.05);border:1px solid var(--stroke2);color:var(--muted);border-radius:999px;
  padding:5px 11px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;transition:.15s}
.gtab:hover{color:var(--ink);border-color:rgba(255,255,255,.32)}
.gtab[aria-pressed="true"]{background:linear-gradient(96deg,rgba(139,92,255,.42),rgba(34,211,238,.3));
  border-color:rgba(160,120,255,.8);color:#fff}
.gbody{padding:16px 18px 20px;overflow-y:auto;flex:1}
.gsec{margin:0 0 15px}
.gsec:last-child{margin-bottom:0}
.gsec h5{margin:0 0 5px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--v2)}
.gsec.note h5{color:var(--a)}
.gsec p{margin:0;font-size:13px;line-height:1.75;color:#d5d7f2}
.gsec.note p{color:var(--muted)}
.gsec b{color:#fff;font-weight:700}
.gterms{margin:0;padding:0;list-style:none}
.gterms li{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;line-height:1.7}
.gterms li:last-child{border-bottom:0;padding-bottom:0}
.gterms dfn{display:block;font-style:normal;font-weight:700;color:#a5f3ea;margin-bottom:3px}
.gterms span{color:var(--muted)}
@media(max-width:640px){
  .gpanel{right:10px;left:10px;bottom:10px;width:auto;max-height:84vh}
  .gfab{right:12px;bottom:12px;padding:11px 15px;font-size:12.5px}
}
@media(max-width:1080px){
  .charts{grid-template-columns:1fr}
  .dpad{grid-template-columns:200px minmax(0,1fr);gap:22px}
  .dpad>div:last-child{grid-column:1/-1}
}
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dist{flex-wrap:wrap}.dist button{flex:1 1 30%}
  .dpad{grid-template-columns:1fr}
}
@media(max-width:700px){.wrap{padding:24px 12px}.stats{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">

<div class="topbar">
  <div>
    <div class="kicker"><i></i><span data-i18n="kicker"></span></div>
    <h1 data-i18n="title"></h1>
  </div>
  <div class="langsw" id="langsw">
    <button data-lang="en" aria-pressed="true">EN</button>
    <button data-lang="ja" aria-pressed="false">日本語</button>
  </div>
</div>
<p class="lead" data-i18n-html="lead"></p>

<section class="stats">
  <div class="stat glass"><span data-i18n="stPools"></span><b id="count">—</b><small data-i18n="stPoolsSub"></small></div>
  <div class="stat glass"><span data-i18n="stMax"></span><b>100</b><small data-i18n="stMaxSub"></small></div>
  <div class="stat glass"><span data-i18n="stAvg"></span><b id="avg">—</b><small><span data-i18n="stMedian"></span> <span id="med">—</span></small></div>
  <div class="stat glass"><span data-i18n="stChecked"></span><b style="font-size:18px">2026-08-28 02:45:24+00</b><small data-i18n="stCheckedSub"></small></div>
</section>

<section class="charts">
  <div class="chart glass">
    <h3 data-i18n="chartDist"></h3>
    <svg id="curve" viewBox="0 0 760 320" role="img"></svg>
    <p class="cap" data-i18n="chartDistCap"></p>
  </div>
  <div class="chart glass">
    <h3 data-i18n="chartHex"></h3>
    <svg id="hex" viewBox="0 0 400 330" role="img"></svg>
    <p class="cap" data-i18n-html="chartHexCap"></p>
    <div class="hexnote" id="hexrare"></div>
  </div>
</section>

<div class="dist" id="dist"></div>

<details class="legend glass" open>
  <summary data-i18n="legendTitle"></summary>
  <div class="legendgrid" id="legendgrid"></div>
</details>

<div class="rankhead">
  <h2 id="ranktitle"></h2>
  <button id="backrank" hidden></button>
</div>
<div class="tools">
  <input id="q" data-i18n-ph="searchPh" aria-label="search">
  <div class="chips" id="chips">
    <button class="chip" data-g="all" aria-pressed="true" data-i18n="allGrades"></button>
    <button class="chip" data-g="S" aria-pressed="false">S</button>
    <button class="chip" data-g="A" aria-pressed="false">A</button>
    <button class="chip" data-g="B" aria-pressed="false">B</button>
    <button class="chip" data-g="C" aria-pressed="false">C</button>

    ['chain','Relays are the <b>routes themselves</b> for carrying blocks and transactions between nodes. Thin or lopsided routing is generally thought to affect how fast things propagate and how well the network absorbs failures.']]},

    ['what','How many of the registered relays actually answered when contacted.'],

    ['low','Generally it suggests the configuration and reality have drifted apart, or that some hosts are down or blocking.'],

    ['low','Generally it suggests a node still syncing, freshly restarted, or under load.'],
    ['note','It may have been behind only for the instant it was measured. A few seconds can flip this one.']]},

    ['chain','With only one, losing it makes the pool hard for the network to see. From the pool side, a block it produces becomes harder to spread.'],
    ['low','Generally it suggests a small setup, a cost-conscious configuration, or private relays kept separately.'],
    ['note','<b>Private relays and internal topology cannot be observed from outside.</b> The real setup may have far more slack. About 82% of the 1,282 pools here fall into this category, so it is not unusual on Cardano.']]},

    ['what','The pool registers exactly the same address string as another pool.'],

    ['low','Generally it suggests a relay hosting service, one operator running several pools, or a joint operation.'],
    ['note','Most often it is simply a third-party service, and it is <b>not proof of common ownership</b>.']]},

    ['what','The registered names differ, but they resolve to the same server - the same IP address and port.'],
    ['holder','Different names, same actual place.'],
    ['chain','Like a shared endpoint, this is a common point where an outage can spread at once. It is one reason apparent decentralisation and real decentralisation can diverge.'],

    ['note','Ordinary cloud and NAT configurations produce this naturally. On its own it settles nothing.']]},

    ['chain','Even where stake looks spread across many pools, the number of parties actually running them may be smaller. That bears on how genuinely distributed the stake is.'],
    ['low','Generally it suggests the same automation, the same administrator, or the same written procedure.'],
    ['note','<b>A correlation, not proof.</b> Unrelated operators following the same guide or tool can line up by coincidence.']]},

    ['chain','It puts load on shared infrastructure without contributing routing of its own, and it depends on that infrastructure staying available.'],

    ['note','It may also be deliberate. Asking the operator about the registration is the reliable way to know.']]},

    ['chain','During such a period the pool may have been hard to reach from outside even while running.'],
    ['low','Generally it suggests a server migration, a response to an attack, or brief maintenance.'],
    ['note','<b>This is history, not the current state.</b> The pool may be running perfectly well now.']]},

    ['what','The shortest round-trip time between connecting and getting an answer back.'],
    ['holder','A rough measure of network distance from the observation point to that relay.'],
    ['chain','Slow propagation means a block takes longer to reach other nodes. Where several blocks compete for the same moment, that is generally thought to be a disadvantage.'],
    ['low','Generally it suggests geographic distance or a congested route.'],
    ['note','<b>Heavily dependent on where it was measured from.</b> A pool far from this vantage point is not slow globally. That is why this axis is worth only 5 points.']]},

    ['RTT','Round Trip Time - how long a connection takes to answer, in milliseconds.'],
    ['KES','The key used to sign blocks. It is required to be rotated periodically for safety.'],
    ['Epoch','The Cardano unit of time: five days. Last 30 epochs is about 150 days.'],
    ['Stake / delegators','How much ADA is delegated to the pool, and how many people delegate it.'],
    ['Pool ID','The unique identifier for a pool, beginning pool1... A ticker can be changed; the pool ID cannot.'],

  ]

/* base language is English; only an explicit user choice switches it */
let lang=(function(){
  try{const s=localStorage.getItem('relaylang'); if(s&&I18N[s])return s;}catch(e){}
  return 'en';
})();
const T=()=>I18N[lang];

const fmt=n=>new Intl.NumberFormat(T().locale,{maximumFractionDigits:1}).format(n);
const pct=n=>(Math.round(n*1000)/10).toFixed(1)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ==================== model ==================== */
const GRADES=[
  {g:'S',min:95,max:100},{g:'A',min:85,max:95},{g:'B',min:70,max:85},
  {g:'C',min:50,max:70},{g:'D',min:0,max:50}
];
const GCOL={S:'#34e2b0',A:'#22d3ee',B:'#8b5cff',C:'#fbbf24',D:'#ff5c93'};
const gradeOf=s=>GRADES.find(x=>s>=x.min).g;
const STATES=['active','partial','degraded','stopped'];
const STCLS={active:'st-active',partial:'st-partial',degraded:'st-degraded',stopped:'st-stopped',unknown:'st-unknown'};
/* Status is derived from the probe counts themselves, so the page needs nothing
   beyond the three public CSVs. (Verified identical to the recorded observation
   log for all 1282 pools.) */
function stateOf(x){
  if(x.probed<=0)return 'unknown';
  if(x.reachable===0)return 'stopped';
  if(x.atTip===0)return 'degraded';
  if(x.reachable<x.probed||x.atTip<x.reachable)return 'partial';
  return 'active';
}
const AXES=[['reach',35],['redundancy',15],['independence',25],['ownership',10],['continuity',10],['latency',5]];
const SIGNALS=[
  {k:'reach',test:x=>x.reachable<x.probed},
  {k:'ip'   ,test:x=>!!x.sharedIp},
  {k:'kes'  ,test:x=>!!x.kesLinked},
  {k:'tip'  ,test:x=>x.atTip<x.reachable||x.atTip===0},
  {k:'ep'   ,test:x=>!!x.shared},
  {k:'redun',test:x=>x.reachable<=2}
];

data.forEach(x=>{
  x.grade=gradeOf(x.score);
  x._st=stateOf(x);
  x.issues=(x.issues||[]).map(i=>typeof i==='string'?{code:'RAW',a:i}:i);
});
const N=data.length;
const counts={};GRADES.forEach(g=>counts[g.g]=0);data.forEach(x=>counts[x.grade]++);
const sortedScores=data.map(x=>x.score).sort((a,b)=>a-b);
const sigCounts={};SIGNALS.forEach(s=>sigCounts[s.k]=data.filter(s.test).length);
const rareCounts={removedAll:data.filter(x=>x.removedAll).length,
                  foreign:data.filter(x=>x.foreign).length,
                  noRtt:data.filter(x=>x.rtt==null).length};

function issueText(i){
  if(i.code==='RAW')return i.a;
  const f=T().issues[i.code];
  return f?f(i.a,i.b):i.code;
}
function benignList(x){
  const t=T().benign,a=[];
  if(x.reachable<x.probed||x.atTip<x.reachable)a.push(t.reach);
  if(x.reachable===1)a.push(t.single);
  if(x.shared)a.push(t.ep);
  if(x.sharedIp)a.push(t.ip);
  if(x.kesLinked)a.push(t.kes);
  if(x.foreign)a.push(t.foreign);
  if(x.removedAll)a.push(t.removed);
  if(x.rtt>1000)a.push(t.rtt);
  return a.length?T().benignJoin(a):T().benignNone;
}

/* ==================== hexagon helpers ==================== */
function hexPoint(cx,cy,r,i,n,v){
  const a=(-90+i*(360/n))*Math.PI/180;
  return [cx+r*v*Math.cos(a),cy+r*v*Math.sin(a)];
}
function hexPoly(cx,cy,r,vals){
  return vals.map((v,i)=>hexPoint(cx,cy,r,i,vals.length,v).map(n=>n.toFixed(1)).join(',')).join(' ');
}

function drawCurve(){
  const svg=document.querySelector('#curve');
  const W=760,H=320,L=46,R=16,Tp=34,Bt=54;
  const x0=27.5,x1=100.5;
  const px=v=>L+(v-x0)/(x1-x0)*(W-L-R);
  const BIN=5,bins=[];
  for(let s=30;s<100;s+=BIN)bins.push({lo:s,hi:s+BIN,c:0});
  data.forEach(d=>{let i=Math.floor((d.score-30)/BIN);if(i>=bins.length)i=bins.length-1;if(i<0)i=0;bins[i].c++;});
  const maxc=Math.max(...bins.map(b=>b.c));
  const py=c=>H-Bt-(c/maxc)*(H-Tp-Bt), base=py(0);
  const pts=[[px(x0),base]].concat(bins.map(b=>[px((b.lo+b.hi)/2),py(b.c)]),[[px(100),py(bins[bins.length-1].c)]]);
  function spline(p){
    let d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
    for(let i=0;i<p.length-1;i++){
      const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p[i+1],t=.62;
      const c1x=p1[0]+(p2[0]-p0[0])/6*t,c1y=Math.min(base,p1[1]+(p2[1]-p0[1])/6*t);
      const c2x=p2[0]-(p3[0]-p1[0])/6*t,c2y=Math.min(base,p2[1]-(p3[1]-p1[1])/6*t);
      d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+','+c2x.toFixed(1)+' '+c2y.toFixed(1)+','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
    }
    return d;
  }
  const line=spline(pts);
  const area=line+'L'+px(100).toFixed(1)+' '+base+'L'+px(x0).toFixed(1)+' '+base+'Z';
  let defs='',bands='',labels='',hit='';
  GRADES.forEach((g,i)=>{
    const a=px(Math.max(x0,g.min)),b=px(Math.min(x1,g.max)),w=Math.max(0,b-a);
    defs+='<clipPath id="cp'+g.g+'"><rect x="'+a.toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+H+'"/></clipPath>'+
      '<linearGradient id="lg'+g.g+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+GCOL[g.g]+'" stop-opacity=".62"/>'+
      '<stop offset="100%" stop-color="'+GCOL[g.g]+'" stop-opacity=".05"/></linearGradient>';
    bands+='<path d="'+area+'" fill="url(#lg'+g.g+')" clip-path="url(#cp'+g.g+')"/>';
    if(g.min>x0)bands+='<line x1="'+a.toFixed(1)+'" y1="'+Tp+'" x2="'+a.toFixed(1)+'" y2="'+base+'" stroke="'+GCOL[g.g]+'" stroke-opacity=".45" stroke-dasharray="3 4"/>';
    const cx=(a+b)/2;
    labels+='<g><rect x="'+(cx-19).toFixed(1)+'" y="'+(Tp-26)+'" width="38" height="21" rx="7" fill="'+GCOL[g.g]+'"/>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(Tp-11)+'" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0620">'+g.g+'</text>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(base+18)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+GCOL[g.g]+'">'+fmt(counts[g.g])+'</text>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(base+31)+'" text-anchor="middle" font-size="10" fill="#6e73a6">'+pct(counts[g.g]/N)+'</text></g>';
    hit+='<rect class="hit" data-g="'+g.g+'" x="'+a.toFixed(1)+'" y="'+(Tp-28)+'" width="'+w.toFixed(1)+'" height="'+(base-Tp+40)+'" fill="transparent" style="cursor:pointer"><title>'+g.g+'</title></rect>';
  });
  let ticks='';
  [30,40,50,60,70,80,85,90,95,100].forEach(v=>{
    ticks+='<line x1="'+px(v).toFixed(1)+'" y1="'+base+'" x2="'+px(v).toFixed(1)+'" y2="'+(base+4)+'" stroke="#4b4f80"/>'+
      '<text x="'+px(v).toFixed(1)+'" y="'+(base+45)+'" text-anchor="middle" font-size="10" fill="#6e73a6">'+v+'</text>';
  });
  svg.innerHTML='<defs>'+defs+
    '<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff5c93"/>'+
    '<stop offset="34%" stop-color="#fbbf24"/><stop offset="62%" stop-color="#8b5cff"/>'+
    '<stop offset="100%" stop-color="#34e2b0"/></linearGradient>'+
    '<filter id="glow" x="-30%" y="-60%" width="160%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/>'+
    '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+
    bands+'<path d="'+line+'" fill="none" stroke="url(#stroke)" stroke-width="2.6" filter="url(#glow)" stroke-linecap="round"/>'+
    '<line x1="'+L+'" y1="'+base+'" x2="'+(W-R)+'" y2="'+base+'" stroke="#4b4f80"/>'+ticks+
    '<text x="'+(L-8)+'" y="'+(base+4)+'" text-anchor="end" font-size="10" fill="#6e73a6">0</text>'+
    '<text x="'+(L-8)+'" y="'+(py(maxc)+4)+'" text-anchor="end" font-size="10" fill="#6e73a6">'+maxc+'</text>'+
    labels+hit;
}

  });
  return '<svg viewBox="0 0 172 176">'+grid+
    '<polygon points="'+hexPoly(cx,cy,r,vals)+'" fill="'+GCOL[x.grade]+'" fill-opacity=".3" stroke="'+GCOL[x.grade]+'" stroke-width="2"/>'+
    vals.map((v,i)=>{const p=hexPoint(cx,cy,r,i,AXES.length,v);
      return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+GCOL[x.grade]+'"/>';}).join('')+lb+'</svg>';
}

/* ==================== rows ==================== */
function signalsHtml(x){
  const p=[],P=T().pills;
  if(x.shared)    p.push('<span class="pill warn">'+esc(P.ep)+'</span>');
  if(x.sharedIp)  p.push(x.ipKey
                    ? '<button class="pill warn" data-gtype="ip" data-gkey="'+esc(x.ipKey)+'">'+esc(P.ip)+' ×'+x.sharedIpPools+'</button>'
                    : '<span class="pill warn">'+esc(P.ip)+' ×'+x.sharedIpPools+'</span>');
  if(x.kesLinked) p.push('<button class="pill warn" data-gtype="kes" data-gkey="'+esc(x.kesCluster)+'">'+esc(P.kes)+' ×'+x.kesClusterSize+'</button>');
  if(x.foreign)   p.push('<span class="pill bad">'+esc(P.foreign)+'</span>');
  if(x.removedAll)p.push('<span class="pill bad">'+esc(P.removed)+'</span>');
  return p.length?p.join(''):'<span class="pill ok">'+esc(P.none)+'</span>';
}
function miniBar(x){
  return '<div class="mini c'+x.grade+'">'+AXES.map(a=>{
    const v=x.parts[a[0]]||0;
    return '<i style="flex:'+a[1]+'" title="'+esc(T().axes[a[0]])+' '+fmt(v)+'/'+a[1]+'"><b style="width:'+(v/a[1]*100).toFixed(0)+'%"></b></i>';
  }).join('')+'</div>';
}
function detailRow(x){
  const axes=AXES.map(a=>{
    const v=x.parts[a[0]]||0,p=v/a[1]*100;
    return '<div class="lb">'+esc(T().axes[a[0]])+'</div>'+
      '<div class="bar'+(p<60?' low':'')+'"><i style="width:'+p.toFixed(1)+'%"></i></div>'+
      '<div class="vl">'+fmt(v)+'<span class="sub"> /'+a[1]+'</span></div>';
  }).join('');
  const issues=x.issues.length
    ? '<ul class="issues">'+x.issues.map(i=>'<li>'+esc(issueText(i))+'</li>').join('')+'</ul>'
    : '<p class="noissue">'+esc(T().dNoIssue)+'</p>';
  return '<tr class="detail"><td colspan="8"><div class="dpad">'+
    '<div class="hexcell"><h3>'+esc(T().dHex)+'</h3>'+poolHex(x)+'</div>'+
    '<div><h3>'+esc(T().dBreak(x.score))+'</h3><div class="axis">'+axes+'</div>'+
      '<div class="idrow"><code>'+esc(x.pool)+'</code>'+
      '<button class="btn" data-copy="'+esc(x.pool)+'">'+esc(T().copyBtn)+'</button></div></div>'+
    '<div><h3>'+esc(T().dSignals(x.issues.length))+'</h3>'+issues+
      '<p class="note"><b>'+esc(T().dBenign)+'</b>'+esc(benignList(x))+'</p>'+
      '<p class="note">'+esc(T().dMeta(x))+'</p></div>'+
  '</div></td></tr>';
}
function rowHtml(x){
  const t=T(),open=openSet.has(x.pool);
  const tipCls=x.atTip===0?'cD':(x.atTip<x.reachable?'cC':'cS');
  return '<tr class="row'+(open?' open':'')+'" data-pool="'+esc(x.pool)+'">'+
    '<td class="rank"><span class="caret">▶</span> '+x.rank+'</td>'+
    '<td><div class="ticker">'+esc(x.ticker||t.noTicker)+'</div>'+
      '<div class="poolid" title="'+esc(x.pool)+'">'+esc(x.pool)+'</div></td>'+
    '<td><div class="scorecell"><span class="badge '+x.grade+'">'+x.grade+'</span>'+
      '<span class="scoreval c'+x.grade+'">'+x.score+'</span><span class="sub">'+t.scoreOf+'</span></div>'+miniBar(x)+'</td>'+
    '<td><span class="st '+STCLS[x._st]+'"><span class="dot"></span>'+esc(t.statusLabel[x._st])+'</span></td>'+
    '<td class="num"><div>'+esc(t.reachWord)+' <b>'+x.reachable+'</b> <span class="sub">/ '+esc(t.probeWord)+' '+x.probed+'</span></div>'+
      '<div class="sub">'+esc(t.atTipWord)+' <b class="'+tipCls+'">'+x.atTip+'</b> '+esc(t.hostsWord)+'</div></td>'+
    '<td class="num">'+(x.rtt==null?'<span class="sub">'+esc(t.noRtt)+'</span>':'<b>'+fmt(x.rtt)+'</b> <span class="sub">ms</span>')+'</td>'+
    '<td>'+signalsHtml(x)+'</td>'+
    '<td class="num"><div>'+fmt(x.stake)+' <span class="sub">₳</span></div>'+
      '<div class="sub">'+fmt(x.blocks)+' '+esc(t.blocksWord)+' · '+fmt(x.delegators)+' '+esc(t.delegWord)+'</div></td>'+
  '</tr>'+(open?detailRow(x):'');
}

const SORTS={
  rank:(a,b)=>a.rank-b.rank,
  scoreAsc:(a,b)=>b.rank-a.rank,
  rtt:(a,b)=>((a.rtt==null)-(b.rtt==null))||((a.rtt||0)-(b.rtt||0))||(a.rank-b.rank),
  stake:(a,b)=>b.stake-a.stake||a.rank-b.rank,
  blocks:(a,b)=>b.blocks-a.blocks||a.rank-b.rank,
  ticker:(a,b)=>(a.ticker||'￿').localeCompare(b.ticker||'￿')||a.rank-b.rank
};

/* ==================== state ==================== */
const body=document.querySelector('#body'),q=document.querySelector('#q'),
      limit=document.querySelector('#limit'),sortSel=document.querySelector('#sort'),
      hint=document.querySelector('#hint'),chips=document.querySelector('#chips'),
      dist=document.querySelector('#dist'),sigBox=document.querySelector('#sigfilter'),
      sigLabel=document.querySelector('#sigfilterlabel'),langsw=document.querySelector('#langsw');
let grade='all',signal=null,group=null;
const openSet=new Set();

const byPool={};data.forEach(x=>{byPool[x.pool]=x;});

// ランキングに載らないメンバーも同じ表に並べる。列は揃え、値のない欄は畳む。
function unrankedRow(m){
  const t=T();
  return '<tr class="row unranked">'+
    '<td class="rank">&mdash;</td>'+
    '<td><div class="ticker" style="color:var(--muted)">'+esc(m.t||t.noTicker)+'</div>'+
      '<div class="poolid" title="'+esc(m.p)+'">'+esc(m.p)+'</div></td>'+
    '<td colspan="6"><span class="sub">'+esc(t.grpUnranked)+'</span></td></tr>';
}

function renderGroup(){
  const t=T(),s=q.value.trim().toLowerCase();
  const raw=(GROUPS[group.type]&&GROUPS[group.type][group.key])||[];
  let list=raw.map(m=>byPool[m.p]?{x:byPool[m.p]}:{u:m});
  const total=list.length, ranked=list.filter(o=>o.x).length;
  if(s)list=list.filter(o=>{
    const tk=(o.x?o.x.ticker:o.u.t)||'', id=o.x?o.x.pool:o.u.p;
    return tk.toLowerCase().indexOf(s)>=0||id.toLowerCase().indexOf(s)>=0;
  });
  const sorter=SORTS[sortSel.value];
  list.sort((a,b)=>(a.x&&b.x)?sorter(a.x,b.x):((a.x?0:1)-(b.x?0:1)));
  document.querySelector('#ranktitle').innerHTML=
    (group.type==='kes'?esc(t.grpKes)+esc(group.key):esc(t.grpIp)+'<code>'+esc(group.key)+'</code>')+
    esc(t.grpPools(total));
  hint.textContent=t.grpHint(total,ranked);
  body.innerHTML=list.map(o=>o.x?rowHtml(o.x):unrankedRow(o.u)).join('');
}

function render(){
  document.querySelector('#backrank').hidden=!group;
  if(group){renderGroup();return;}
  document.querySelector('#ranktitle').textContent=T().rankingTitle;
  const s=q.value.trim().toLowerCase(),max=+limit.value;
  const sig=signal?SIGNALS.find(z=>z.k===signal):null;
  const hits=data.filter(x=>
    (grade==='all'||x.grade===grade)&&(!sig||sig.test(x))&&
    (!s||(x.ticker||'').toLowerCase().indexOf(s)>=0||x.pool.toLowerCase().indexOf(s)>=0)
  ).sort(SORTS[sortSel.value]);
  const rows=hits.slice(0,max);
  hint.textContent=hits.length?T().hitsSome(hits.length,hits.length>rows.length?rows.length:0):T().hitsNone;
  body.innerHTML=rows.map(rowHtml).join('')||
    '<tr><td colspan="8" style="padding:30px;text-align:center;color:var(--dim)">—</td></tr>';
}
function syncChips(){
  Array.prototype.forEach.call(chips.children,c=>c.setAttribute('aria-pressed',String(c.dataset.g===grade)));
  Array.prototype.forEach.call(dist.children,c=>c.setAttribute('aria-pressed',String(c.dataset.g===grade)));
  const sig=signal?SIGNALS.find(z=>z.k===signal):null;
  sigBox.classList.toggle('on',!!sig);
  if(sig)sigLabel.textContent=T().sigFilterLabel+T().signals[sig.k];
}
function setGrade(g){grade=g;group=null;syncChips();render();}
function setSignal(k){signal=k;group=null;syncChips();render();}
// グループを開くときは他の絞り込みを解除する。狙いは「その仲間を全部見る」なので。
function setGroup(g){group=g;grade='all';signal=null;openSet.clear();syncChips();render();
  document.querySelector('.rankhead').scrollIntoView({block:'start'});}

/* ==================== language application ==================== */
function applyLang(){
  const t=T();
  t.statusLabel={
    active:  lang==='ja'?'正常'   :'Healthy',
    partial: lang==='ja'?'一部のみ':'Partial',
    degraded:lang==='ja'?'Tip遅れ' :'Behind tip',
    stopped: lang==='ja'?'到達なし':'No response',
    unknown: lang==='ja'?'未観測'  :'Not observed'
  };
  document.documentElement.lang=t.htmlLang;
  document.title=t.docTitle;

  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t[el.dataset.i18n];});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML=t[el.dataset.i18nHtml];});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t[el.dataset.i18nPh];});

  const keepSort=sortSel.value||'rank',keepLimit=limit.value||'100';
  sortSel.innerHTML=t.sorts.map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join('');
  limit.innerHTML=t.limits.map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join('');
  sortSel.value=keepSort;limit.value=keepLimit;

  document.querySelector('#count').textContent=fmt(N);
  document.querySelector('#avg').textContent=fmt(data.reduce((a,b)=>a+b.score,0)/N);
  document.querySelector('#med').textContent=fmt(sortedScores[Math.floor(N/2)]);

  dist.innerHTML=GRADES.map(g=>
    '<button class="c'+g.g+'" data-g="'+g.g+'" aria-pressed="false" title="'+esc(t.gradeDesc[g.g])+'">'+
    '<span class="badge '+g.g+'">'+g.g+'</span>'+
    '<div class="n">'+fmt(counts[g.g])+' <span class="sub">'+pct(counts[g.g]/N)+'</span></div>'+
    '<div class="r">'+esc(t.gradeRange[g.g])+' · '+esc(t.gradeDesc[g.g])+'</div>'+
    '<div class="track"><i style="width:'+(counts[g.g]/Math.max(...Object.values(counts))*100).toFixed(1)+'%"></i></div>'+
    '</button>').join('');

  document.querySelector('#legendgrid').innerHTML=
    '<div><h3>'+esc(t.lgGrade)+'</h3><ul>'+GRADES.map(g=>
      '<li><span class="badge '+g.g+'">'+g.g+'</span><span><b>'+esc(t.gradeRange[g.g])+'</b> — '+esc(t.gradeDesc[g.g])+'</span></li>').join('')+'</ul></div>'+
    '<div><h3>'+esc(t.lgStatus)+'</h3><ul>'+STATES.map(s=>{
      const col={active:'var(--m)',partial:'var(--a)',degraded:'#ff9558',stopped:'var(--p)'}[s];
      return '<li><span class="dot" style="background:'+col+';box-shadow:0 0 9px '+col+'"></span>'+
        '<span><b>'+esc(t.statusLabel[s])+'</b> — '+esc(t.statusDesc[s])+'</span></li>';}).join('')+
      '</ul><p class="context" style="margin-top:8px">'+esc(t.statusNote)+'</p></div>'+
    '<div><h3>'+esc(t.lgSignals)+'</h3><ul>'+t.sigLegend.map(r=>
      '<li><span class="pill '+r[0]+'">'+esc(r[1])+'</span><span>'+esc(r[2])+'</span></li>').join('')+'</ul></div>'+
    '<div><h3>'+esc(t.lgHow)+'</h3><ul>'+t.howto.map(r=>
      '<li><span class="caret">'+r[0]+'</span><span>'+r[1]+'</span></li>').join('')+'</ul></div>';

  document.querySelector('#refbody').innerHTML=t.risks.map(r=>
    '<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('');
  document.querySelector('#methodbody').innerHTML=t.method;

  document.querySelector('#backrank').textContent=t.backToRanking;
  drawCurve();drawHex();syncChips();render();renderGuide();
  Array.prototype.forEach.call(langsw.children,b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
}

/* ==================== events ==================== */
body.addEventListener('click',function(e){
  const cp=e.target.closest('[data-copy]');
  if(cp){
    if(navigator.clipboard)navigator.clipboard.writeText(cp.dataset.copy);
    cp.textContent=T().copyDone;
    setTimeout(()=>{cp.textContent=T().copyBtn;},1400);
    return;
  }
  const gb=e.target.closest('[data-gtype]');
  if(gb){setGroup({type:gb.dataset.gtype,key:gb.dataset.gkey});return;}
  if(e.target.closest('tr.detail'))return;
  const tr=e.target.closest('tr.row');if(!tr)return;
  const p=tr.dataset.pool;if(!p)return;
  if(openSet.has(p))openSet.delete(p);else openSet.add(p);
  render();
});
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)setGrade(b.dataset.g);});
dist.addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(b)setGrade(b.dataset.g===grade?'all':b.dataset.g);});
document.querySelector('#curve').addEventListener('click',e=>{
  const h=e.target.closest('.hit');if(h)setGrade(h.dataset.g===grade?'all':h.dataset.g);});
document.querySelector('#hex').addEventListener('click',e=>{
  const h=e.target.closest('.hexlabel');if(h)setSignal(h.dataset.k===signal?null:h.dataset.k);});
document.querySelector('#sigclear').addEventListener('click',()=>setSignal(null));
document.querySelector('#backrank').addEventListener('click',()=>{group=null;openSet.clear();syncChips();render();});
langsw.addEventListener('click',e=>{
  const b=e.target.closest('button[data-lang]');if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;
  try{localStorage.setItem('relaylang',lang);}catch(err){}
  applyLang();
});
q.addEventListener('input',render);
limit.addEventListener('change',render);
sortSel.addEventListener('change',render);

/* ---------------- holder guide ---------------- */
const gfab=document.querySelector('#gfab'),gpanel=document.querySelector('#gpanel'),
      gtabs=document.querySelector('#gtabs'),gbody=document.querySelector('#gbody');
let gtopic=0;

function renderGuide(){
  const g=T().guide;
  document.querySelector('#gfablabel').textContent=g.fab;
  document.querySelector('#gtitle').textContent=g.title;
  document.querySelector('#gsub').textContent=g.sub;
  if(gtopic>=g.topics.length)gtopic=0;
  gtabs.innerHTML=g.topics.map((t,i)=>
    '<button class="gtab" data-i="'+i+'" aria-pressed="'+(i===gtopic)+'">'+esc(t.label)+'</button>').join('');
  const t=g.topics[gtopic];
  gbody.innerHTML = t.terms
    ? '<ul class="gterms">'+t.terms.map(x=>'<li><dfn>'+esc(x[0])+'</dfn><span>'+esc(x[1])+'</span></li>').join('')+'</ul>'
    : t.s.map(sec=>'<div class="gsec'+(sec[0]==='note'?' note':'')+'">'+
        '<h5>'+esc(g.sec[sec[0]])+'</h5><p>'+sec[1]+'</p></div>').join('');
  gbody.scrollTop=0;
}
function openGuide(key){
  const ts=T().guide.topics;
  if(key){const i=ts.findIndex(t=>t.k===key); if(i>=0)gtopic=i;}
  renderGuide();
  gpanel.classList.add('on');
  gfab.style.display='none';
}
function closeGuide(){gpanel.classList.remove('on');gfab.style.display='';}

gfab.addEventListener('click',()=>openGuide());
document.querySelector('#gclose').addEventListener('click',closeGuide);
gtabs.addEventListener('click',e=>{
  const b=e.target.closest('.gtab'); if(!b)return;
  gtopic=+b.dataset.i; renderGuide();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&gpanel.classList.contains('on'))closeGuide();});


applyLang();
</script></body></html>
